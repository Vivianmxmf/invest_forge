[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-terminal"
version = "0.1.0"
description = "AI-driven subjective investment research assistant — LangGraph Multi-Agent + Hybrid RAG."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vivianmxmf" }]
keywords = ["langgraph", "rag", "investment-research", "ai-agent", "multi-agent"]

[project.urls]
Homepage = "https://github.com/Vivianmxmf/janus-terminal"
Repository = "https://github.com/Vivianmxmf/janus-terminal"

[tool.setuptools.packages.find]
where = ["."]
include = ["janus_terminal*"]
exclude = ["tests*", "notebooks*", "frontend*", "scripts*", "configs*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "TID", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["janus_terminal"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["notebooks/"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "unit: fast pure-Python unit tests",
    "integration: requires network / vector store / real LLM",
    "slow: long-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["janus_terminal"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 65
